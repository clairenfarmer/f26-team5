<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/high-fidelity-prototype/styles.css">
    <title>User Dashboard - HobbyCircles</title>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <!-- Nav Bar-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Hobby Circles</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">

                    <a class="nav-link active" aria-current="page" href="index.html">Features</a>
                    <a class="nav-link" href="login.html">Login</a>
                    <a class="nav-link" href="register.html">Get Started</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="section">
      <div class="container">
        <div
          style="background: white; padding: 1.5rem; border-radius: var(--border-radius); box-shadow: var(--box-shadow); margin-bottom: 2rem;">
          <h3 style="font-weight: 700; margin-bottom: 1rem;">Filter Groups</h3>
          <div class="grid grid-4" style="gap: 1rem;">
            <div>
              <label style="margin-bottom: 0.5rem;">Interest Tags</label>
              <select style="width: 100%;">
                <option>Any Interests</option>
                <option>Crafting</option>
                <option>Games</option>
                <option>Outdoors</option>
                <option>Reading</option>
                <option>Sports</option>
              </select>
            </div>
            <div>
              <label style="margin-bottom: 0.5rem;">Skill Level</label>
              <select style="width: 100%;">
                <option>All Skill Levels</option>
                <option>Beginner</option>
                <option>Intermediate</option>
                <option>Advanced</option>
              </select>
            </div>
            
            <div style="display: flex; align-items: flex-end;">
              <button class="btn btn-primary" style="width: 100%;">Apply Filters</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    


</body>


</html>
