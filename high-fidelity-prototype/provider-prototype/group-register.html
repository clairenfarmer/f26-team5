<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <!-- Nav Bar-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Hobby Circles</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">

                    <a class="nav-link active" aria-current="page" href="index.html">Features</a>
                    <a class="nav-link" href="login.html">Login</a>
                    <a class="nav-link" href="register.html">Get Started</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
    <div class="row justify-content-center">
        <div class="col-md-9 mt-5">
            <div class="card shadow-sm p-4">
                <h3 class="mb-4">Create Your Group Profile</h3>
                <form>
                    <h4 class="mb-2">Group Information</h4>
                    <div class="mb-3">
                            <label for="fullName" class="form-label">Group Name *</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Enter your group name"
                                required>
                        </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email address *</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Password *</label>
                        <input type="password" class="form-control" id="exampleInputPassword1" required>
                    </div>

                    <h4 class="mb-2">Details</h4>
                    <div class="mb-3">
                            <label for="fullName" class="form-label">Provide a description for your group</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Enter a brief description of your group">
                        </div>
                    <button type="submit" class="btn btn-warning">Submit</button>
                </form>

            </div>
        </div>
    </div>
</div>
</body>
